name: Convert to sing-box SRS

on:
  push:
    paths:
      - 'rules/direct.list'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install sing-box 1.13.x
        run: |
          VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases | \
            grep -oP '"tag_name": "v\K1\.13\.\d+' | head -1)
          echo "Installing sing-box v${VERSION}"
          curl -Lo sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-${VERSION}-linux-amd64/sing-box /usr/local/bin/
          sing-box version

      - name: Convert direct.list to SRS
        run: |
          python3 << 'EOF'
          import json

          domains = []
          domain_suffixes = []
          domain_keywords = []
          ip_cidrs = []

          with open("rules/direct.list", "r") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#") or line.startswith("!"):
                      continue

                  # Strip inline comments: "DOMAIN-SUFFIX,example.com #comment"
                  if " #" in line:
                      line = line[:line.index(" #")].strip()
                  if not line:
                      continue

                  # Parse Clash-style format: TYPE,value
                  if "," in line:
                      rule_type, value = line.split(",", 1)
                      rule_type = rule_type.strip().upper()
                      value = value.strip()

                      if rule_type == "DOMAIN":
                          domains.append(value)
                      elif rule_type == "DOMAIN-SUFFIX":
                          domain_suffixes.append(value)
                      elif rule_type == "DOMAIN-KEYWORD":
                          domain_keywords.append(value)
                      elif rule_type in ("IP-CIDR", "IP-CIDR6"):
                          # Strip ,no-resolve if present
                          value = value.split(",")[0].strip()
                          ip_cidrs.append(value)
                  else:
                      # Fallback: treat plain entries as domain suffix
                      domain_suffixes.append(line)

          # Build sing-box rule-set source JSON
          rules = {}
          if domains:
              rules["domain"] = sorted(set(domains))
          if domain_suffixes:
              rules["domain_suffix"] = sorted(set(domain_suffixes))
          if domain_keywords:
              rules["domain_keyword"] = sorted(set(domain_keywords))
          if ip_cidrs:
              rules["ip_cidr"] = sorted(set(ip_cidrs))

          rule_set = {
              "version": 4,
              "rules": [rules] if rules else []
          }

          with open("rules/direct.json", "w") as f:
              json.dump(rule_set, f, indent=2, ensure_ascii=False)

          print(f"Converted: {len(domains)} domain, {len(domain_suffixes)} domain_suffix, "
                f"{len(domain_keywords)} domain_keyword, {len(ip_cidrs)} ip_cidr")
          EOF

      - name: Compile JSON to SRS binary
        run: |
          sing-box rule-set compile rules/direct.json -o rules/direct.srs
          echo "Generated rules/direct.srs ($(stat -c%s rules/direct.srs) bytes)"

      - name: Verify SRS file
        run: |
          sing-box rule-set decompile rules/direct.srs -o /tmp/verify.json
          echo "Verification passed. Content:"
          cat /tmp/verify.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/direct.srs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-convert direct.list to sing-box SRS"
            git push
          fi
