name: Convert Ruleset to MRS

on:
  push:
    paths:
      - 'rules/direct.list'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download mihomo
        run: |
          MIHOMO_VERSION="v1.19.0"
          wget -qO mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gzip -d mihomo.gz
          chmod +x mihomo

      - name: Convert classical to domain format
        run: |
          FILE="rules/direct.list"
          DOMAIN_FILE="${FILE}.domain"

          # 过滤注释和空行，然后转换为 domain 通配符格式
          # DOMAIN-SUFFIX,x  → .x   (后缀匹配)
          # DOMAIN,x         → x    (精确匹配)
          # DOMAIN-KEYWORD,x → 无法用 domain 格式表达，输出警告并跳过
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$FILE" | while IFS= read -r line; do
            case "$line" in
              DOMAIN-SUFFIX,*)
                echo ".${line#DOMAIN-SUFFIX,}"
                ;;
              DOMAIN,*)
                echo "${line#DOMAIN,}"
                ;;
              DOMAIN-KEYWORD,*)
                echo "::warning::DOMAIN-KEYWORD 无法转为 domain 格式，已跳过: $line"
                ;;
              *)
                echo "::warning::未知规则类型，已跳过: $line"
                ;;
            esac
          done > "$DOMAIN_FILE"

          TOTAL=$(wc -l < "$FILE")
          CONVERTED=$(wc -l < "$DOMAIN_FILE")
          echo "转换完成: $CONVERTED / $TOTAL 条规则"
          echo "--- 预览前 10 行 ---"
          head -10 "$DOMAIN_FILE"

      - name: Convert to MRS
        run: |
          ./mihomo convert-ruleset domain text "rules/direct.list.domain" "rules/direct.mrs"
          rm -f "rules/direct.list.domain"

      - name: Verify MRS file
        run: |
          MRS_FILE="rules/direct.mrs"

          # 检查文件是否存在且非空
          if [ ! -s "$MRS_FILE" ]; then
            echo "::error::MRS file is empty or missing"
            exit 1
          fi

          # 检查文件头 — .mrs 是 zstd 压缩格式，magic bytes 为 28 B5 2F FD
          MAGIC=$(xxd -l 4 -p "$MRS_FILE")
          if [ "$MAGIC" != "28b52ffd" ]; then
            echo "::error::Invalid MRS file header: $MAGIC (expected zstd magic: 28b52ffd)"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$MRS_FILE")
          echo "✅ MRS file is valid (size: ${FILE_SIZE} bytes, format: zstd)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/direct.mrs
          # 仅在有变更时提交
          git diff --cached --quiet || git commit -m "chore: auto convert direct.list to direct.mrs"
          git push
