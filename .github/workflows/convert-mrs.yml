name: Convert Ruleset to MRS

on:
  push:
    paths:
      - 'rules/direct.list'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download mihomo
        run: |
          MIHOMO_VERSION="v1.19.0"
          wget -qO mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gzip -d mihomo.gz
          chmod +x mihomo

      - name: Detect rule type and convert
        run: |
          FILE="rules/direct.list"

          # 自动检测规则类型：如果包含 DOMAIN / DOMAIN-SUFFIX 等关键字则为 domain 类型
          # 如果包含 IP-CIDR 则为 ipcidr 类型，否则为 classical 类型
          if head -20 "$FILE" | grep -qiE '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|FULL)'; then
            TYPE="domain"
          elif head -20 "$FILE" | grep -qiE '^IP-CIDR'; then
            TYPE="ipcidr"
          else
            TYPE="domain"
          fi

          # 过滤注释和空行，生成干净的临时文件
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$FILE" > "${FILE}.clean"

          echo "Detected rule type: $TYPE"
          ./mihomo convert-ruleset "$TYPE" text "${FILE}.clean" "rules/direct.mrs"
          rm -f "${FILE}.clean"

      - name: Verify MRS file
        run: |
          MRS_FILE="rules/direct.mrs"

          # 检查文件是否存在且非空
          if [ ! -s "$MRS_FILE" ]; then
            echo "::error::MRS file is empty or missing"
            exit 1
          fi

          # 检查文件头 — .mrs 是 zstd 压缩格式，magic bytes 为 28 B5 2F FD
          MAGIC=$(xxd -l 4 -p "$MRS_FILE")
          if [ "$MAGIC" != "28b52ffd" ]; then
            echo "::error::Invalid MRS file header: $MAGIC (expected zstd magic: 28b52ffd)"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$MRS_FILE")
          echo "✅ MRS file is valid (size: ${FILE_SIZE} bytes, format: zstd)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/direct.mrs
          # 仅在有变更时提交
          git diff --cached --quiet || git commit -m "chore: auto convert direct.list to direct.mrs"
          git push
