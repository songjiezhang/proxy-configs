name: Convert Ruleset

on:
  push:
    paths:
      - 'rules/direct.list'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── 安装工具 ──
      - name: Install mihomo
        run: |
          MIHOMO_VERSION="v1.19.0"
          wget -qO mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gzip -d mihomo.gz
          chmod +x mihomo

      - name: Install sing-box
        run: |
          VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases | \
            grep -oP '"tag_name": "v\K1\.13\.\d+' | head -1)
          echo "Installing sing-box v${VERSION}"
          curl -Lo sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-${VERSION}-linux-amd64/sing-box /usr/local/bin/
          sing-box version

      # ── mihomo: classical → domain text → .mrs ──
      - name: Convert to mihomo domain format
        run: |
          FILE="rules/direct.list"
          DOMAIN_FILE="${FILE}.domain"

          # DOMAIN-SUFFIX,x  → .x   (后缀匹配)
          # DOMAIN,x         → x    (精确匹配)
          # DOMAIN-KEYWORD,x → 无法用 domain 格式表达，输出警告并跳过
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$FILE" | while IFS= read -r line; do
            case "$line" in
              DOMAIN-SUFFIX,*)
                echo ".${line#DOMAIN-SUFFIX,}"
                ;;
              DOMAIN,*)
                echo "${line#DOMAIN,}"
                ;;
              DOMAIN-KEYWORD,*)
                echo "::warning::DOMAIN-KEYWORD 无法转为 mihomo domain 格式，已跳过: $line"
                ;;
              *)
                echo "::warning::未知规则类型，已跳过: $line"
                ;;
            esac
          done > "$DOMAIN_FILE"

          echo "mihomo: $(wc -l < "$DOMAIN_FILE") 条规则已转换"

      - name: Compile MRS
        run: |
          ./mihomo convert-ruleset domain text "rules/direct.list.domain" "rules/direct.mrs"
          rm -f "rules/direct.list.domain"

      - name: Verify MRS
        run: |
          if [ ! -s "rules/direct.mrs" ]; then
            echo "::error::MRS file is empty or missing"
            exit 1
          fi
          MAGIC=$(xxd -l 4 -p "rules/direct.mrs")
          if [ "$MAGIC" != "28b52ffd" ]; then
            echo "::error::Invalid MRS header: $MAGIC (expected 28b52ffd)"
            exit 1
          fi
          echo "✅ MRS valid ($(stat -c%s "rules/direct.mrs") bytes)"

      # ── sing-box: classical → JSON → .srs ──
      - name: Convert to sing-box JSON
        run: |
          python3 << 'EOF'
          import json

          domains = []
          domain_suffixes = []
          domain_keywords = []
          ip_cidrs = []

          with open("rules/direct.list", "r") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#") or line.startswith("!"):
                      continue
                  if " #" in line:
                      line = line[:line.index(" #")].strip()
                  if not line:
                      continue

                  if "," in line:
                      rule_type, value = line.split(",", 1)
                      rule_type = rule_type.strip().upper()
                      value = value.strip()

                      if rule_type == "DOMAIN":
                          domains.append(value)
                      elif rule_type == "DOMAIN-SUFFIX":
                          domain_suffixes.append(value)
                      elif rule_type == "DOMAIN-KEYWORD":
                          domain_keywords.append(value)
                      elif rule_type in ("IP-CIDR", "IP-CIDR6"):
                          value = value.split(",")[0].strip()
                          ip_cidrs.append(value)
                  else:
                      domain_suffixes.append(line)

          rules = {}
          if domains:
              rules["domain"] = sorted(set(domains))
          if domain_suffixes:
              rules["domain_suffix"] = sorted(set(domain_suffixes))
          if domain_keywords:
              rules["domain_keyword"] = sorted(set(domain_keywords))
          if ip_cidrs:
              rules["ip_cidr"] = sorted(set(ip_cidrs))

          rule_set = {
              "version": 4,
              "rules": [rules] if rules else []
          }

          with open("rules/direct.json", "w") as f:
              json.dump(rule_set, f, indent=2, ensure_ascii=False)

          print(f"sing-box: {len(domains)} domain, {len(domain_suffixes)} domain_suffix, "
                f"{len(domain_keywords)} domain_keyword, {len(ip_cidrs)} ip_cidr")
          EOF

      - name: Compile SRS
        run: |
          sing-box rule-set compile rules/direct.json -o rules/direct.srs
          echo "✅ SRS valid ($(stat -c%s "rules/direct.srs") bytes)"

      - name: Verify SRS
        run: |
          sing-box rule-set decompile rules/direct.srs -o /tmp/verify.json
          echo "SRS verification passed"

      # ── 提交 ──
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/direct.mrs rules/direct.srs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-convert direct.list to MRS & SRS"
            git push
          fi
